[package]
name = "tdc-vanity"
version = "0.1.0"
edition = "2024"
publish = false
description = "Parallel mainnet Tidecoin P2SH-P2WPKH vanity address generator"

[dependencies]
bs58 = { version = "0.5.1", default-features = false, features = ["check"] }
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
getrandom = "0.4"
ripemd = "0.1.3"
sha2 = "0.10.9"
tempfile = "3.27"
tide-fn-dsa-kgen = "=0.5.0"
tide-fn-dsa-sign = { version = "=0.5.0", features = ["small_context"] }
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[dev-dependencies]
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

